[project]
name = "jiexialai-backend"
version = "0.6.0"
description = "「截下来」无状态智能代理后端（契约桩 → 真实视觉模型）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136",
    "uvicorn>=0.46",
    "pydantic>=2.10",
    "httpx>=0.28",
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
