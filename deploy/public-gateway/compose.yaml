name: jiexialai-public
services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      # 缺少该值时 compose 直接拒绝启动（fail closed）；值只存在于服务器 .env
      JXL_SITE_SERVICE_TOKEN: ${JXL_SITE_SERVICE_TOKEN:?缺少 JXL_SITE_SERVICE_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/data
      - ./config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
